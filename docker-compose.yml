# pkos production services. Joins shared `web` network (see jepsn1/infra).
name: pkos

services:
  api:
    build: .
    container_name: pkos-api
    restart: unless-stopped
    env_file: .env            # prod env, repo root — never committed
    # Run as host uid 1000 (marcus) so vault writes/commits stay host-owned and
    # host-side git keeps working. HOME=/tmp gives git a writable home.
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      # Canonical knowledge vault (jepsn1/knowledge checkout), rw for ingest;
      # VAULT_PATH=/vault in .env points the api at it.
      - /srv/data/knowledge:/vault
      # Sermon audio uploads; UPLOADS_PATH=/uploads in .env. Create host dir
      # once: mkdir -p /srv/data/uploads/pkos && chown 1000:1000 (api writes it).
      - /srv/data/uploads/pkos:/uploads
    networks: [web]
    ports:
      # Tailscale-only exposure: bound to this host's tailscale IPv4 (TAILSCALE_IP
      # in .env, from `tailscale ip -4`). NEVER 0.0.0.0 — published ports bypass UFW.
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sermon transcription: polls sermon_jobs, faster-whisper (cpu), embeds
  # chunks via ollama. Safe to restart any time — stale `processing` jobs are
  # re-queued (STALE_PROCESSING_MIN, default 60).
  worker:
    build: apps/worker
    container_name: pkos-worker
    restart: unless-stopped
    env_file: .env
    networks: [web]
    volumes:
      - /srv/data/uploads/pkos:/uploads   # read audio the api saved
      - whisper-cache:/root/.cache        # keep the ~460MB model across restarts

  ollama:
    image: ollama/ollama:rocm
    container_name: pkos-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    ports:
      - "127.0.0.1:11434:11434"   # native dev access only
    volumes:
      - /srv/data/ollama:/root/.ollama
    networks: [web]

networks:
  web:
    external: true

volumes:
  whisper-cache:
