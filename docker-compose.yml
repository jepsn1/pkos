# pkos production services. Joins shared `web` network (see jepsn1/infra).
name: pkos

services:
  api:
    build: .
    container_name: pkos-api
    restart: unless-stopped
    env_file: .env            # prod env, repo root — never committed
    # Run as host uid 1000 (marcus) so vault writes/commits stay host-owned and
    # host-side git keeps working. HOME=/tmp gives git a writable home.
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      # Canonical knowledge vault (jepsn1/knowledge checkout), rw for ingest;
      # VAULT_PATH=/vault in .env points the api at it.
      - /srv/data/knowledge:/vault
      # Sermon audio uploads; UPLOADS_PATH=/uploads in .env. Create host dir
      # once: mkdir -p /srv/data/uploads/pkos && chown 1000:1000 (api writes it).
      - /srv/data/uploads/pkos:/uploads
    networks: [web]
    ports:
      # Tailscale-only exposure: bound to this host's tailscale IPv4 (TAILSCALE_IP
      # in .env, from `tailscale ip -4`). NEVER 0.0.0.0 — published ports bypass UFW.
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:3002:3002"
      # Also localhost so `tailscale serve` can wrap the api in HTTPS (attachment
      # URLs need a real cert to render in webui/Obsidian without mixed-content).
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pkos-webui
    restart: unless-stopped
    volumes:
      # webui's own state (accounts, its chat history) — NOT pkos data
      - /srv/data/webui:/app/backend/data
    networks: [web]
    environment:
      # Talk to the pkos assistant (OpenAI-compat surface, model "pkos"),
      # NOT raw ollama — retrieval + citations happen in the api.
      OPENAI_API_BASE_URL: http://pkos-api:3002/v1
      OPENAI_API_KEY: ${OPENAI_COMPAT_API_KEY:?set OPENAI_COMPAT_API_KEY in .env}
      ENABLE_OLLAMA_API: "false"
      # Pin voice-mode STT language — unset = whisper auto-detects per clip and
      # flip-flops en/da on short audio. Change to "da" if you speak Danish to it.
      WHISPER_LANGUAGE: "en"
      # English-only whisper: faster + more accurate than multilingual "base" for
      # en. Drop to "tiny.en" for more speed if accuracy holds. (was "base")
      WHISPER_MODEL: "base.en"
      # Fixed JWT signing key — the image defaults it to empty and regenerates a
      # random one each start, logging everyone out on every restart. Pin it.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
    ports:
      # Tailscale-only, same rule as the api port
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8081:8080"
      # Also on localhost so `tailscale serve` (HTTPS at :8443) can proxy to it —
      # gives webui a real cert so the browser unlocks the mic for voice mode.
      - "127.0.0.1:8081:8080"

  # Local neural TTS (OpenAI-compatible) for webui voice mode. Returns audio
  # files iOS can play — the built-in transformers TTS is broken (dataset) and
  # browser TTS is blocked on iOS Safari. Kokoro-82M, CPU (~1.4s/reply).
  # NOTE: the -rocm image exists but defaults to CPU on gfx1030 without
  # entrypoint/HSA_OVERRIDE tuning — not worth ~1s for the added fragility on
  # 16GB. Revisit on a bigger/CUDA card (GPU TTS → ~0.4s).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: pkos-kokoro
    restart: unless-stopped
    networks: [web]   # reached by webui as http://pkos-kokoro:8880

  # Sermon transcription: polls sermon_jobs, faster-whisper (cpu), embeds
  # chunks via ollama. Safe to restart any time — stale `processing` jobs are
  # re-queued (STALE_PROCESSING_MIN, default 60).
  worker:
    build: apps/worker
    container_name: pkos-worker
    restart: unless-stopped
    env_file: .env
    networks: [web]
    volumes:
      - /srv/data/uploads/pkos:/uploads   # read audio the api saved
      - whisper-cache:/root/.cache        # keep the ~460MB model across restarts
      # yt-dlp cookies.txt to get past YouTube's "confirm you're not a bot" wall.
      # Drop a cookies.txt in /srv/data/ytdlp (YTDLP_COOKIES=/ytdlp/cookies.txt).
      # NOT read-only: yt-dlp rewrites the file with refreshed session cookies,
      # which also extends how long they stay valid.
      - /srv/data/ytdlp:/ytdlp

  ollama:
    image: ollama/ollama:rocm
    container_name: pkos-ollama
    restart: unless-stopped
    environment:
      # qwen3:14b (9.6G) + nomic-embed (0.3G) fit 16G VRAM together — keep both
      # resident so embeds never wait on a model load behind a long generation.
      OLLAMA_KEEP_ALIVE: 24h
      # ROCm/gfx1030 runners wedge under concurrent slots (3 hangs on 2026-07-14,
      # webui fires title-gen parallel to chat) — force strictly serial requests.
      # scripts/ollama-watchdog.sh (cron */3) recovers if it wedges anyway.
      OLLAMA_NUM_PARALLEL: 1
    devices:
      - /dev/kfd
      - /dev/dri
    ports:
      - "127.0.0.1:11434:11434"   # native dev access only
      # Tailscale-only: raw ollama (no auth) reachable from your tailnet devices.
      # Same trust level as api/webui. NEVER 0.0.0.0 (published ports bypass UFW).
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:11434:11434"
    volumes:
      - /srv/data/ollama:/root/.ollama
    networks: [web]

  # Self-hosted metasearch backing the api's web_search tool. Queries leave the
  # box via SearXNG to public engines (result content is from the internet);
  # self-hosting keeps there being no third-party API key / account. INTERNAL
  # ONLY — no published port, reached by the api as http://pkos-searxng:8080
  # (SEARXNG_URL in .env). Config + secret in /srv/data/searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: pkos-searxng
    restart: unless-stopped
    volumes:
      - /srv/data/searxng:/etc/searxng
    networks: [web]

  # DB table inspector (tailscale-only). Login: server infra-postgres, user pkos
  # + pkos db password from .env DATABASE_URL (or postgres superuser for other dbs,
  # password in /srv/infra/compose/.env).
  adminer:
    image: adminer:latest
    container_name: pkos-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: infra-postgres
    networks: [web]
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8082:8080"

networks:
  web:
    external: true

volumes:
  whisper-cache:
