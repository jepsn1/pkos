# pkos production services. Joins shared `web` network (see jepsn1/infra).
name: pkos

services:
  api:
    build: .
    container_name: pkos-api
    restart: unless-stopped
    env_file: .env            # prod env, repo root — never committed
    # Run as host uid 1000 (marcus) so vault writes/commits stay host-owned and
    # host-side git keeps working. HOME=/tmp gives git a writable home.
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      # Canonical knowledge vault (jepsn1/knowledge checkout), rw for ingest;
      # VAULT_PATH=/vault in .env points the api at it.
      - /srv/data/knowledge:/vault
    networks: [web]
    ports:
      # Tailscale-only exposure: bound to this host's tailscale IPv4 (TAILSCALE_IP
      # in .env, from `tailscale ip -4`). NEVER 0.0.0.0 — published ports bypass UFW.
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pkos-webui
    restart: unless-stopped
    volumes:
      # webui's own state (accounts, its chat history) — NOT pkos data
      - /srv/data/webui:/app/backend/data
    networks: [web]
    environment:
      # Talk to the pkos assistant (OpenAI-compat surface, model "pkos"),
      # NOT raw ollama — retrieval + citations happen in the api.
      OPENAI_API_BASE_URL: http://pkos-api:3002/v1
      OPENAI_API_KEY: ${OPENAI_COMPAT_API_KEY:?set OPENAI_COMPAT_API_KEY in .env}
      ENABLE_OLLAMA_API: "false"
    ports:
      # Tailscale-only, same rule as the api port
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8081:8080"

  ollama:
    image: ollama/ollama:rocm
    container_name: pkos-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    ports:
      - "127.0.0.1:11434:11434"   # native dev access only
    volumes:
      - /srv/data/ollama:/root/.ollama
    networks: [web]

networks:
  web:
    external: true
